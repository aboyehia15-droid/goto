<!doctype html>
<html lang="ar" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حضور وانصراف المعلمين والموظفين</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C4F47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحضور">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface2:#F6F9F8; --text:#16302C; --muted:#586C68; --line:#D3DFDC;
  --primary:#0C4F47; --primary-h:#093F39; --on-primary:#FFFFFF; --primary-soft:#DCECE8;
  --out:#20342F; --on-out:#FFFFFF;
  --gold:#D9A800; --gold-soft:#FBF1CC;
  --ok:#1D7446; --ok-soft:#DDF1E5; --warn:#855400; --warn-soft:#FCEFCF; --bad:#A93222; --bad-soft:#F8DDD8;
  --shadow:0 1px 2px rgba(12,40,36,.06),0 6px 18px rgba(12,40,36,.05);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0E1917;--surface:#15231F;--surface2:#1B2B27;--text:#E6F0EE;--muted:#9DB4AF;--line:#2B403B;--primary:#4FB3A6;--primary-h:#66C6B9;--on-primary:#06201C;--primary-soft:#173630;--out:#D7E6E3;--on-out:#0E1917;--gold:#F0C419;--gold-soft:#3A3010;--ok:#5CCB8B;--ok-soft:#143526;--warn:#F0B84D;--warn-soft:#3A2C10;--bad:#F08A7A;--bad-soft:#3F1B16;--shadow:none}
}
:root[data-theme="dark"]{--bg:#0E1917;--surface:#15231F;--surface2:#1B2B27;--text:#E6F0EE;--muted:#9DB4AF;--line:#2B403B;--primary:#4FB3A6;--primary-h:#66C6B9;--on-primary:#06201C;--primary-soft:#173630;--out:#D7E6E3;--on-out:#0E1917;--gold:#F0C419;--gold-soft:#3A3010;--ok:#5CCB8B;--ok-soft:#143526;--warn:#F0B84D;--warn-soft:#3A2C10;--bad:#F08A7A;--bad-soft:#3F1B16;--shadow:none}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.appbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:8px 14px}
.appbar .lg{background:#fff;border-radius:10px;padding:3px 5px;display:flex;align-items:center;border:1px solid var(--line)}
.appbar .lg img{height:38px;width:auto;display:block}
.appbar .ttl{text-align:center;min-width:0}
.appbar .ttl b{display:block;font-weight:600;font-size:17px;line-height:1.3}
.appbar .ttl span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acctbar{max-width:980px;margin:0 auto;padding:8px 14px 0;display:flex;gap:8px;flex-wrap:wrap}
.acctbar .btn svg.i{width:16px;height:16px;margin-inline-end:4px}

.navwrap{max-width:980px;margin:0 auto;padding:10px 14px 0}
.nav{display:flex;gap:6px;overflow-x:auto}
.nav button{position:relative;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;min-height:44px;font-weight:500;white-space:nowrap;color:var(--text)}
.nav button[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.nav .bd{background:var(--bad);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px;font-weight:600}
@media (max-width:719px){
  .navwrap{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .nav{gap:2px;overflow:visible}
  .nav button{flex:1;flex-direction:column;gap:2px;border:0;background:transparent;padding:6px 2px;font-size:12px;border-radius:10px;min-height:52px;color:var(--muted)}
  .nav button[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
  .nav .bd{position:absolute;top:2px;left:calc(50% + 2px)}
}

main{max-width:980px;margin:0 auto;padding:16px 14px 110px}
h2{font-size:20px;margin:6px 0 12px;font-weight:600}
h3{font-size:17px;margin:0 0 8px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface)}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14.5px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--text)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:38px;padding:4px 12px;font-size:14.5px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text)}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label,.lbl{font-weight:500;font-size:14.5px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=month],input[type=number],select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
input.pin{letter-spacing:.4em;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:88px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 16px;min-height:44px;font-weight:500;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.seg button+button{border-inline-start:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:13.5px;font-weight:500;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.pri{background:var(--primary-soft);color:var(--primary)}
.switch{display:flex;align-items:flex-start;gap:12px;margin:8px 0}
.switch input{width:22px;height:22px;margin-top:4px;accent-color:var(--primary);flex:none}
.pick{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface)}
.pick input{width:22px;height:22px;accent-color:var(--primary);flex:none}
.pick:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:12.5px;color:var(--muted)}
.dash-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:13.5px;max-width:220px}
.legend .lg{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend .lg i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .nm{font-weight:600}
.li .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14.5px}
.tally{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 12px;font-size:15px}
.tally span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));margin-inline-end:6px}

.stage{display:grid;justify-items:center;gap:6px;padding:6px 0 0;text-align:center}
.stage .dow{font:700 30px/1.2 Amiri,'Traditional Arabic','Noto Naskh Arabic',serif}
.stage .dt{color:var(--muted);font-size:15px;line-height:1.5}
.clock{font-size:44px;font-weight:600;line-height:1.1;margin:14px 0 22px;font-variant-numeric:tabular-nums}
.punch{--c:var(--primary);--f:var(--on-primary);width:224px;height:224px;border-radius:50%;border:0;background:var(--c);color:var(--f);display:grid;place-items:center;align-content:center;gap:8px;position:relative;font-weight:600;font-size:21px;box-shadow:0 0 0 8px var(--bg),0 0 0 10px var(--gold),0 16px 32px rgba(12,79,71,.25)}
.punch svg.i{width:78px;height:78px;stroke-width:1.4}
.punch .sub{font-size:14.5px;font-weight:500;opacity:.9;margin-top:-6px;max-width:180px;line-height:1.3}
.fs{border:1px solid var(--line);border-radius:12px;padding:6px 12px 2px;margin:0 0 10px}
.fs legend{padding:0 6px;font-weight:600;font-size:14.5px}
.punch.out{--c:var(--out);--f:var(--on-out)}
.punch.done,.punch.off,.punch.blocked{--c:var(--surface2);--f:var(--muted);box-shadow:0 0 0 8px var(--bg),0 0 0 10px var(--line);cursor:default}
.punch.blocked span{font-size:16px;padding:0 10px;text-align:center}
.punch:not(.done):not(.off):active{transform:scale(.98)}
.punch.busy::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:3px solid var(--gold);animation:pulse 1.1s ease-out infinite}
@keyframes pulse{from{transform:scale(.94);opacity:.9}to{transform:scale(1.07);opacity:0}}
@media (prefers-reduced-motion:reduce){.punch.busy::after{animation:none;opacity:.7}}
.today2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px;margin-top:26px}
.today2 div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.today2 small{display:block;color:var(--muted);font-size:13.5px}
.today2 b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

.ctrl{display:grid;gap:12px}
.ctrl .period{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .period input{width:auto;min-width:150px}
.papers{margin-top:6px;overflow-x:auto;padding-bottom:6px}
.papers .paper{zoom:var(--z,1)}
.editable{cursor:pointer}
.editable:hover{background:#FFF8DB}
.plist{width:100%;max-width:460px;margin-top:22px;text-align:start}

.ov{position:fixed;inset:0;background:rgba(8,24,21,.55);z-index:60;display:grid;place-items:center;padding:16px 14px}
.dlg{background:var(--surface);color:var(--text);border-radius:16px;padding:18px;width:100%;max-width:480px;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dfoot{display:flex;gap:10px;justify-content:flex-start;margin-top:8px;flex-wrap:wrap}
#toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;z-index:70;pointer-events:none;padding:0 14px}
@media (min-width:720px){#toast{bottom:24px}}
#toast div{background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:420px}
#toast div.ok{background:var(--ok);color:#fff}
#toast div.bad{background:var(--bad);color:#fff}
.loading{text-align:center;padding:60px 0;color:var(--muted)}

.paper{background:#fff;color:#000;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;direction:rtl;box-sizing:border-box;width:210mm;margin:0 auto 18px;padding:10mm;box-shadow:0 1px 4px rgba(0,0,0,.3);line-height:1.5;font-size:11pt}
.paper.land{width:297mm;padding:8mm}
.paper *{box-sizing:border-box}
.sh-logos{display:flex;justify-content:space-between;align-items:center}
.sh-logos img{height:22mm;width:auto;max-width:64mm;object-fit:contain;display:block}
.sh-title{font-family:Amiri,'Traditional Arabic','Noto Naskh Arabic',serif;font-weight:700;font-size:26pt;line-height:1.25;text-align:center;margin:1mm 0 3mm;color:#000}
.sh-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:10mm;border-top:1.6pt solid #0C4F47;border-bottom:.6pt solid #0C4F47;padding:2.2mm 1mm;margin-bottom:4mm;font-size:10.5pt}
.sh-meta .rl{font-size:9.5pt;color:#333}
.sh-meta .pl{font-size:10pt}
table.sh{width:100%;border-collapse:collapse;font-size:10pt;text-align:center;color:#000}
table.sh th,table.sh td{border:.6pt solid #555;padding:1.05mm 1.2mm;vertical-align:middle}
table.sh thead th{background:#DDE9E6;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.sh thead{display:table-header-group}
table.sh tr{break-inside:avoid}
table.sh td.tm{white-space:nowrap;font-variant-numeric:tabular-nums}
table.sh td.nt{text-align:right;font-size:9pt}
table.sh tr.wk td{border-top:1.6pt solid #0C4F47}
table.sh tr.st-none td{background:#F3E4E1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.sh tr.st-hol td{background:#EAEAEA;color:#333;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.linkbtn{background:none;border:0;color:#0C4F47;text-decoration:underline;font:inherit;font-size:10pt;cursor:pointer;min-height:32px;padding:0 6px}
.sh-sum{margin-top:4mm;font-size:10.5pt;border:.6pt solid #555;padding:2mm 3mm}
.sh-foot{margin-top:4mm;font-size:8.5pt;color:#444;text-align:left}
table.mx{font-size:8pt}
table.mx th,table.mx td{padding:.8mm .5mm}
table.mx td.nm{text-align:right;white-space:nowrap;padding-inline:1.5mm;font-size:8.5pt}
table.mx th.n,table.mx td.n{width:7mm}
table.mx th.dh{font-size:7.5pt;line-height:1.25}
table.mx th.dh .ds{font-weight:400}
table.mx th.io{font-size:6pt;font-weight:400;line-height:1.2}
table.mx .c{line-height:1.3;font-size:7.5pt;font-variant-numeric:tabular-nums}
table.mx .c span{display:block;white-space:nowrap}
table.mx .c span+span{border-top:.4pt solid #999}
table.mx .c em{display:block;font-style:normal;font-size:6pt;color:#333}
table.mx .c1{font-size:7pt}
table.mx .c+.c{border-top:.5pt dashed #666;margin-top:.5mm;padding-top:.5mm}
table.mx .c0{color:#555}
table.sh td[rowspan]{vertical-align:middle}
table.mx td.hol,table.mx th.hol{background:#E4E4E4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.mx td.none{background:#F3E4E1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.mx td.tot{font-weight:600}
table.mx.dense{font-size:7pt}
table.mx.dense .c{font-size:6.4pt}
table.mx.dense td.nm{font-size:7.6pt;padding-inline:1mm}
table.mx.dense th.dh{font-size:6.6pt}
table.mx.dense th.io{font-size:5pt}
table.mx.dense .c em,table.mx.dense .c1{font-size:5.2pt}
@media print{.paper{width:auto!important;margin:0!important;padding:0!important;box-shadow:none!important;break-after:page}.paper:last-child{break-after:auto}.no-print{display:none!important}}

@media print{
  html,body{background:#fff!important}
  .no-print,.appbar,.navwrap,#toast,#modal{display:none!important}
  main{padding:0;max-width:none}
  .papers{overflow:visible;margin:0;padding:0}
  .papers .paper{zoom:1!important}
}
</style>
<style id="pgstyle">@page{size:A4 portrait;margin:10mm}</style>
</head>
<body>
<header class="appbar no-print"><div class="in">
  <div class="lg"><img id="logoTA" alt="شعار جمعية تعلم"></div>
  <div class="ttl"><b>حضور وانصراف المعلمين والموظفين</b><span id="who">&nbsp;</span></div>
  <div class="lg"><img id="logoIB" alt="شعار مجمع ابن تيمية القرآني"></div>
</div></header>
<div class="acctbar no-print" id="acctbar" hidden></div>
<div class="navwrap no-print" hidden><nav class="nav" id="nav" aria-label="التنقل"></nav></div>
<main id="view"><div class="loading">جارٍ التحميل…</div></main>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>

const DPARTS=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function nowParts(){const p={};DPARTS.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return p}

/* ---------- الاتصال بالخادم ---------- */
const API_URL=/^https:\/\/script\.google\.com\//.test(String(window.API_URL||'').trim())?String(window.API_URL).trim():'';
const PWA=!!API_URL&&!(window.google&&window.google.script);
function call(action,payload){
  const pl=Object.assign({},payload||{});if(Sess&&Sess.token)pl.token=Sess.token;
  const req={action,payload:pl};
  const bad=r=>{const e=new Error((r&&r.error)||'حدث خطأ');e.auth=!!(r&&r.auth);return e};
  if(window.google&&google.script&&google.script.run){
    return new Promise((res,rej)=>{
      google.script.run
        .withSuccessHandler(r=>{if(r&&r.ok)res(r);else rej(bad(r))})
        .withFailureHandler(()=>rej(new Error('تعذّر الاتصال بالخادم. تحقق من الإنترنت.')))
        .api(req);
    });
  }
  if(!API_URL)return Promise.reject(new Error('لم يُضبط رابط الخادم. عدّل ملف config.js.'));
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(req),redirect:'follow'})
    .then(r=>r.json().catch(()=>{throw new Error('استجابة غير صحيحة من الخادم. تأكد من الرابط ومن أن الوصول «أي شخص».')}),()=>{throw new Error('تعذّر الاتصال بالخادم. تحقق من الإنترنت.')})
    .then(r=>{if(r&&r.ok)return r;throw bad(r)});
}

const S={today:'',ver:-1,holidays:{},shifts:{},att:{},requests:[],teachers:{},me:null,sheetUrl:'',settings:{}};
const U={tab:null,busy:false,rep:null,list:null,lmode:'teacher',lsel:'',err:''};

function setState(st){
  S.ver=st.ver;S.att=st.att||{};S.requests=st.requests||[];S.sheetUrl=st.sheetUrl||'';
  S.holidays={};Object.entries(st.holidays||{}).forEach(([d,n])=>S.holidays[d]={name:n});
  S.shifts=st.shifts||{};S.settings=st.settings||{};
  if(st.role==='teacher'){S.me=st.me;S.teachers={[st.me.id]:{name:st.me.name,role:st.me.role,active:true,order:0,activated:true,kind:st.me.kind||'teacher',shiftIds:st.me.shiftIds||[]}}}
  else{S.me=null;S.teachers=st.teachers||{}}
  scheduleRender();
}
async function loadState(){const r=await call('state');setState(r.state)}
const isAdmin=()=>!!Sess&&Sess.role==='admin';
const teachersSorted=()=>Object.entries(S.teachers).map(([id,t])=>({id,...t})).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name),'ar'));

const mins=hm=>{const [h,m]=hm.split(':').map(Number);return h*60+m};
const fmtDur=m=>m<60?`${m} د`:`${Math.floor(m/60)} س${m%60?` ${m%60} د`:''}`;
const kindLabel=k=>k==='staff'?'موظف':'معلم';
const shiftText=sh=>sh?`${sh.name?sh.name+': ':''}${t12(sh.start)} – ${t12(sh.end)}`:'';
const byStart=(a,b)=>mins(a.start)-mins(b.start);
function personShifts(tid){
  const t=S.teachers[tid];
  return ((t&&t.shiftIds)||[]).map(id=>S.shifts[id]?{id,...S.shifts[id]}:null).filter(Boolean).sort(byStart);
}
const recsOf=(tid,d)=>(S.att[tid]&&S.att[tid][d])||[];
function excuses(tid,d){
  return S.requests.filter(r=>r.tid===tid&&r.status==='approved'&&(
    (r.type==='absence'&&r.from<=d&&d<=(r.to||r.from))||(r.type==='leave'&&r.from===d)));
}
// فترات يوم لفرد: ما سُجِّل فعلاً + الفترات المخصصة له ولم تُسجَّل
function periodsOf(tid,d){
  const assigned=personShifts(tid),used=new Set(),out=[];
  recsOf(tid,d).forEach(r=>{
    let sh=null;
    if(r.ss&&r.se)sh={name:r.sn||'',start:r.ss,end:r.se,grace:r.sg||0};
    else if(r.sid&&S.shifts[r.sid])sh={...S.shifts[r.sid]};
    const m=assigned.find(a=>(r.sid&&a.id===r.sid)||(!r.sid&&sh&&a.start===sh.start&&a.end===sh.end));
    if(m){used.add(m.id);if(!sh)sh={...m}}
    if(sh&&!sh.name&&m)sh.name=m.name;
    out.push({sid:m?m.id:(r.sid||''),sh,rec:r});
  });
  assigned.forEach(a=>{if(!used.has(a.id))out.push({sid:a.id,sh:{name:a.name,start:a.start,end:a.end,grace:a.grace||0},rec:null})});
  if(!out.length)out.push({sid:'',sh:null,rec:null});
  const key=p=>p.sh?mins(p.sh.start):(p.rec&&p.rec.i?mins(p.rec.i):9999);
  return out.sort((x,y)=>key(x)-key(y));
}
const noneLabel=()=>(!S.settings||S.settings.autoAbsentEnabled!==false)?'غياب':'لم يسجّل';
const leaveText=lv=>'استئذان'+(lv.tf?` من ${t12(lv.tf)}${lv.tt?' إلى '+t12(lv.tt):''}`:'');
const overlaps=(x,sh)=>{if(!sh||(!x.tf&&!x.tt))return true;const lf=x.tf||'00:00',lt=x.tt||'23:59';return lf<sh.end&&lt>sh.start};
// فترة واحدة قد تُسجَّل أكثر من مرة (عودة بعد استئذان معتمد): القيم مفصولة بفواصل بنفس الترتيب
function legsOf(r){
  const il=(r&&r.i||'').split(',').map(x=>x.trim()).filter(Boolean);
  const ol=(r&&r.o||'').split(',').map(x=>x.trim()).filter(Boolean);
  const n=Math.max(il.length,ol.length),out=[];
  for(let k=0;k<n;k++)out.push({in:il[k]||'',out:ol[k]||''});
  return out;
}
// عدد الاستئذانات المعتمدة اليوم التي تغطي هذه الفترة؛ كل واحد يمنح فرصة عودة واحدة
function approvedLeaveCount(tid,d,sh){
  return excuses(tid,d).filter(x=>x.type==='leave'&&overlaps(x,sh)).length;
}
// حالة الفترة الآن: todo (لم تبدأ) / open (حضور بلا انصراف) / reopenable (أُغلقت ولا يزال هناك فرصة عودة من استئذان معتمد) / done
function periodLiveState(tid,p){
  const legs=p.rec?legsOf(p.rec):[];
  if(!legs.length||!legs.some(l=>l.in||l.out))return 'todo';
  const last=legs[legs.length-1];
  if(last.in&&!last.out)return 'open';
  const allowed=1+approvedLeaveCount(tid,today(),p.sh);
  return legs.length<allowed?'reopenable':'done';
}
// من لديه أكثر من فترة: لا يُقبل تسجيل حضور (أو عودة) فترته إلا ضمن وقتها المحدد (±MULTI_EARLY/MULTI_LATE دقيقة). الانصراف غير مقيّد بهذا.
const MULTI_EARLY=15,MULTI_LATE=30;
function strictWindowBlocked(tid,sh){
  if(!sh||personShifts(tid).length<=1)return null;
  const now=mins(nowHM()),lo=mins(sh.start)-MULTI_EARLY,hi=mins(sh.end)+MULTI_LATE;
  return (now<lo||now>hi)?true:null;
}
function periodStatus(p,d,ex,T,h,abs){
  const legs=p.rec?legsOf(p.rec):[],notes=[];
  const lv=ex.find(x=>x.type==='leave'&&overlaps(x,p.sh));
  const has=legs.some(l=>l.in||l.out);
  if(has){
    const sh=p.sh,first=legs[0],last=legs[legs.length-1],open=!!(last.in&&!last.out);
    let late=0,early=0;
    if(sh&&!lv){
      if(first.in){const m=mins(first.in)-mins(sh.start);if(m>sh.grace)late=m}
      if(!open&&last.out){const m=mins(sh.end)-mins(last.out);if(m>sh.grace)early=m}
    }
    if(legs.length>1){
      for(let k=0;k<legs.length-1;k++){if(legs[k].out&&legs[k+1].in)notes.push(`عاد ${t12(legs[k+1].in)} بعد استئذان (خرج ${t12(legs[k].out)})`)}
    } else if(lv)notes.push(leaveText(lv));
    if(late)notes.push('تأخر '+fmtDur(late));
    if(early)notes.push('خروج مبكر '+fmtDur(early));
    if(open&&d<T)notes.push('لم يسجّل الانصراف');
    if(p.rec.a)notes.push('تعديل من الإدارة'+(p.rec.n?': '+p.rec.n:''));
    return {k:'present',in:first.in||'',out:last.out||'',legs,late,early,adjusted:!!p.rec.a,leave:!!lv,label:'حاضر',note:notes.join('، ')};
  }
  if(h)return {k:'holiday',label:'إجازة رسمية',note:h.name||''};
  if(abs)return {k:'absent_ok',label:'غياب بعذر',note:''};
  if(lv)return {k:'leave',label:'استئذان',note:leaveText(lv)};
  if(d>T)return {k:'future',label:'',note:''};
  const autoAbsent=!S.settings||S.settings.autoAbsentEnabled!==false;
  const dueEnd=p.sh?mins(p.sh.end):24*60;
  const stillDue=d===T&&(!autoAbsent||mins(nowHM())<dueEnd);
  if(stillDue)return {k:'pending',label:'لم يسجّل بعد',note:''};
  return {k:'none',label:autoAbsent?'غياب':'لم يسجّل',note:p.rec&&p.rec.a?'تعديل من الإدارة':''};
}
function dayStatus(tid,d){
  const T=today(),h=S.holidays[d],ex=excuses(tid,d),abs=ex.find(x=>x.type==='absence');
  const periods=periodsOf(tid,d).map(p=>({...p,st:periodStatus(p,d,ex,T,h,abs)}));
  const pres=periods.filter(p=>p.st.k==='present');
  let k,label;
  if(pres.length){k='present';label='حاضر'}
  else if(h){k='holiday';label='إجازة رسمية'}
  else if(abs){k='absent_ok';label='غياب بعذر'}
  else if(periods.some(p=>p.st.k==='leave')){k='leave';label='استئذان'}
  else if(d>T){k='future';label=''}
  else if(periods.every(p=>p.st.k==='none')){k='none';label='غياب'}
  else{k='pending';label='لم يسجّل بعد'}
  const multi=periods.length>1;
  const note=periods.map(p=>{const n=k==='holiday'?(h.name||''):p.st.note;return n?(multi&&p.sh&&p.sh.name?p.sh.name+': ':'')+n:''}).filter(Boolean).join('؛ ');
  return {k,label,note,periods,
    in:pres.length?pres[0].st.in:'',out:pres.length?[...pres].reverse().map(p=>p.st.out).find(Boolean)||'':'',
    late:periods.filter(p=>p.st.late).length,early:periods.filter(p=>p.st.early).length,
    leave:periods.some(p=>p.st.leave),adjusted:periods.some(p=>p.st.adjusted)};
}
function summarize(tid,days){
  const s={present:0,leave:0,absent:0,none:0,holiday:0,late:0,early:0,missP:0,lateMin:0,earlyMin:0};
  days.forEach(d=>{const st=dayStatus(tid,d);
    if(st.k==='present'){s.present++;st.periods.forEach(p=>{if(p.st.k==='none')s.missP++})}
    else if(st.k==='absent_ok')s.absent++;else if(st.k==='none')s.none++;else if(st.k==='holiday')s.holiday++;
    if(st.k==='leave'||st.leave)s.leave++;
    s.late+=st.late;s.early+=st.early;
    st.periods.forEach(p=>{s.lateMin+=(p.st.late||0);s.earlyMin+=(p.st.early||0)});});
  return s;
}

/* ---------- قفل البصمة الاختياري على الجوال ---------- */
const b64u={
  enc:b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
};
const Bio={
  supported:()=>!!(window.PublicKeyCredential&&navigator.credentials),
  async register(label){
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'حضور وانصراف المعلمين والموظفين'},
      user:{id:new TextEncoder().encode(String(Sess.tid)).slice(0,64),name:label,displayName:label},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
      timeout:60000,attestation:'none'}});
    return b64u.enc(cred.rawId);
  },
  async verify(credId){
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials:[{type:'public-key',id:b64u.dec(credId)}],
      userVerification:'required',timeout:60000}});
    return true;
  }
};
function bioErr(e){
  const m=String(e&&e.message||'');
  if(/permissions policy|not allowed by the user agent|feature is denied/i.test(m)||(e&&e.name==='SecurityError'))return 'المتصفح لا يسمح بالبصمة داخل هذه الصفحة. أوقف قفل البصمة من «حسابي» واعتمد على الرمز.';
  if(e&&e.name==='NotAllowedError')return 'لم يكتمل التحقق بالبصمة. حاول مرة أخرى.';
  if(e&&e.name==='NotSupportedError')return 'هذا الجهاز لا يدعم البصمة.';
  if(e&&e.name==='InvalidStateError')return 'تم تفعيل بصمة هذا الجهاز سابقاً.';
  return /[\u0600-\u06FF]/.test(m)?m:'تعذّر التحقق بالبصمة. حاول مرة أخرى.';
}

/* ---------- شاشة المعلم: البصمة ---------- */
function suggestPeriod(tid){
  const T=today(),ps=periodsOf(tid,T).map(p=>({...p,live:periodLiveState(tid,p)}));
  const open=ps.find(p=>p.live==='open');
  if(open)return {kind:'out',p:open};
  const todo=ps.filter(p=>p.live==='todo'||p.live==='reopenable');
  if(!todo.length)return {kind:'done'};
  const avail=todo.filter(p=>!strictWindowBlocked(tid,p.sh));
  const pool=avail.length?avail:todo;
  const now=mins(nowHM());
  const dist=p=>{if(!p.sh)return 0;const a=mins(p.sh.start),b=mins(p.sh.end);return now<a?a-now:now>b?now-b:0};
  pool.sort((x,y)=>dist(x)-dist(y)||(x.sh?mins(x.sh.start):0)-(y.sh?mins(y.sh.start):0));
  return {kind:'in',p:pool[0],blocked:!avail.length&&todo.length>0};
}
function kindForSid(tid,sid){
  const p=periodsOf(tid,today()).find(x=>x.sid===sid);
  if(!p)return 'in';
  return periodLiveState(tid,p)==='open'?'out':'in';
}
function kindForSid(tid,sid){
  const p=periodsOf(tid,today()).find(x=>x.sid===sid);
  return (p&&p.rec&&p.rec.i&&!p.rec.o)?'out':'in';
}
const OFF_EARLY=60,OFF_LATE=120; // دقائق التسامح قبل بداية الفترة وبعد نهايتها قبل ظهور تنبيه الوقت غير المعتاد
function offShiftWarn(sh){
  if(!sh)return null;
  const now=mins(nowHM()),lo=mins(sh.start)-OFF_EARLY,hi=mins(sh.end)+OFF_LATE;
  return (now<lo||now>hi)?true:null;
}
function beepAlert(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.35);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.4);
    setTimeout(()=>{try{ctx.close()}catch(e){}},600);
  }catch(e){}
  if(navigator.vibrate)try{navigator.vibrate([120,60,120])}catch(e){}
}

/* ---------- رسومات بيانية بسيطة (SVG) بلا أي مكتبات خارجية ---------- */
function svgDonut(segs,size=132,thick=16){
  const total=segs.reduce((a,s)=>a+s.value,0);
  const r=(size-thick)/2,cx=size/2,cy=size/2,C=2*Math.PI*r;
  if(!total)return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${thick}"/></svg>`;
  let off=0;
  const arcs=segs.filter(s=>s.value>0).map(s=>{
    const frac=s.value/total,len=frac*C,rot=off/total*360-90;off+=s.value;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thick}" stroke-dasharray="${len} ${(C-len).toFixed(2)}" transform="rotate(${rot.toFixed(2)} ${cx} ${cy})"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="رسم دائري">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${thick}"/>${arcs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text)">${total}</text>
    <text x="${cx}" y="${cy+17}" text-anchor="middle" font-size="11" fill="var(--muted)">المجموع</text></svg>`;
}
const chartLegend=segs=>`<div class="legend">${segs.filter(s=>s.value>0).map(s=>`<span class="lg"><i style="background:${s.color}"></i>${esc(s.label)} <b>${s.value}</b></span>`).join('')||'<span class="muted small">لا بيانات بعد</span>'}</div>`;
function svgBars(items,{width=520,height=150,color='var(--primary)'}={}){
  const max=Math.max(1,...items.map(i=>i.value)),n=items.length,gap=10,bw=n?(width-gap*(n+1))/n:0;
  const bars=items.map((it,i)=>{
    const h=Math.round((it.value/max)*(height-30)),x=gap+i*(bw+gap),y=height-24-h;
    return `<rect x="${x.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="${h}" rx="3" fill="${color}"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${height-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(it.label)}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${y-4}" text-anchor="middle" font-size="10.5" fill="var(--text)">${it.value}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" role="img" aria-label="رسم بياني">${bars}</svg>`;
}
function svgHBars(items,{width=520,barH=22,gap=10,color='var(--bad)'}={}){
  const max=Math.max(1,...items.map(i=>i.value)),height=items.length*(barH+gap)+gap,labelW=Math.min(150,width*0.34);
  const bars=items.map((it,i)=>{
    const y=gap+i*(barH+gap),w=Math.max(2,Math.round((it.value/max)*(width-labelW-46)));
    return `<text x="${width-labelW-8}" y="${(y+barH*0.7).toFixed(1)}" text-anchor="end" font-size="11.5" fill="var(--text)">${esc(it.label)}</text>
      <rect x="${width-labelW}" y="${y}" width="${w}" height="${barH}" rx="4" fill="${color}"/>
      <text x="${width-labelW+w+6}" y="${(y+barH*0.7).toFixed(1)}" font-size="11" fill="var(--muted)">${it.value}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" role="img" aria-label="ترتيب">${bars}</svg>`;
}

function getLocation(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){rej(new Error('هذا المتصفح لا يدعم تحديد الموقع.'));return}
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      e=>{
        const msg={1:'رفضتَ إذن الموقع. فعّله من إعدادات المتصفح أو الجوال وحاول مرة أخرى.',2:'تعذّر تحديد موقعك حالياً. تأكد من تفعيل GPS وحاول مرة أخرى.',3:'استغرق تحديد الموقع وقتاً طويلاً. حاول مرة أخرى.'}[e.code]||'تعذّر تحديد الموقع.';
        rej(new Error(msg));
      },
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
  });
}
async function doPunch(sid,manualTime){
  sid=sid||'';
  const T=today();
  if(!isWork(T)||S.holidays[T]){toast('اليوم ليس يوم دوام','bad');return}
  const sh=sid&&S.shifts[sid]?{id:sid,...S.shifts[sid]}:null;
  const kind=kindForSid(Sess.tid,sid);
  if(!manualTime){
    if(sh&&kind==='in'&&strictWindowBlocked(Sess.tid,sh)){
      toast(`فترة "${sh.name}" من ${t12(sh.start)} إلى ${t12(sh.end)}. لا يمكن تسجيل الحضور فيها الآن.`,'bad');
      return;
    }
    if(sh&&personShifts(Sess.tid).length<=1&&offShiftWarn(sh)){
      const ok=await confirmOffShift(sh,kind);
      if(!ok)return;
    }
  }
  let loc=null;
  if(sh&&sh.reqLoc){
    toast('يتم تحديد موقعك...');
    try{loc=await getLocation()}catch(e){toast(e.message,'bad');return}
  }
  await guard(async()=>{
    render();
    try{
      let method='pin';
      const cred=Store.get('att_bio_'+Sess.tid);
      if(cred){try{await Bio.verify(cred);method='bio'}catch(e){throw new Error(bioErr(e))}}
      const r=await call('punch',{method,shiftId:sid,loc,manualTime:manualTime||''});
      setState(r.state);
      const pr=dayStatus(Sess.tid,today()).periods.find(p=>p.sid===sid||(r.shiftName&&p.sh&&p.sh.name===r.shiftName));
      const flag=pr?(r.kind==='in'&&pr.st.late?` (تأخر ${fmtDur(pr.st.late)})`:r.kind==='out'&&pr.st.early?` (خروج مبكر ${fmtDur(pr.st.early)})`:''):'';
      toast((r.kind==='in'?'تم تسجيل الحضور ':'تم تسجيل الانصراف ')+(r.shiftName&&personShifts(Sess.tid).length>1?`(${r.shiftName}) `:'')+t12(r.hm)+flag,'ok');
      Store.set(remKey(sid,r.kind),'1');
    }finally{U.busy=false;render()}
  });
}

async function saveDay(tid,d){
  const periods=[];
  for(const fs of $$('#modal fieldset.fs')){
    const ins=fs.querySelectorAll('input[type=time]');
    const inV=ins[0].value,outV=ins[1].value,sid=ins[0].dataset.sid||'',existing=fs.dataset.existing==='1';
    if(inV&&outV&&outV<=inV){toast('الانصراف يجب أن يكون بعد الحضور','bad');return}
    if(!inV&&!outV&&!existing)continue;
    periods.push({sid,in:inV,out:outV});
  }
  if(!periods.length){toast('أدخل وقتاً واحداً على الأقل','bad');return}
  await act('dayEdit',{tid,date:d,note:$('#ed-note').value.trim(),periods},'تم الحفظ',closeModal);
}

function initRep(){const t=today();U.rep={kind:'week',anchor:t,from:t.slice(0,8)+'01',to:t,tid:'all',ptype:'all',shift:'all'}}
function repRange(){
  const r=U.rep;
  if(r.kind==='week'){const f=weekStart(r.anchor);return [f,addDays(f,4)]}
  if(r.kind==='month'){const d=parse(r.anchor);return [ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))]}
  return r.from<=r.to?[r.from,r.to]:[r.to,r.from];
}
function workdays(f,t){const a=[];let d=f,n=0;while(d<=t&&n++<800){if(isWork(d))a.push(d);d=addDays(d,1)}return a}
function firstDataDate(){
  let m=null;
  Object.values(S.att).forEach(a=>Object.keys(a).forEach(d=>{if(!m||d<m)m=d}));
  return m||today().slice(0,8)+'01';
}

    <div class="seg" role="group" aria-label="نوع الفترة" style="justify-self:start"><button data-act="rkind" data-v="week" aria-pressed="${r.kind==='week'}">أسبوعي</button><button data-act="rkind" data-v="month" aria-pressed="${r.kind==='month'}">شهري</button><button data-act="rkind" data-v="range" aria-pressed="${r.kind==='range'}">من – إلى</button></div>
    <div class="period">${r.kind==='range'?

const sheetHead=()=>`<div class="sh-logos"><img src="${LOGO_TA}" alt="شعار جمعية تعلم"><img src="${LOGO_IB}" alt="شعار مجمع ابن تيمية القرآني"></div><h1 class="sh-title">كشف حضور وانصراف</h1>`;
const periodBlock=(f,t)=>`<div class="pl"><div><b>من:</b> ${dLabel(f)}</div><div><b>إلى:</b> ${dLabel(t)}</div></div>`;
const sumLine=s=>`أيام الحضور: <b>${s.present}</b> &nbsp; الاستئذان: <b>${s.leave}</b> &nbsp; الغياب بعذر: <b>${s.absent}</b> &nbsp; ${noneLabel()}: <b>${s.none}</b> &nbsp; التأخر: <b>${s.late}</b> &nbsp; الخروج المبكر: <b>${s.early}</b>${s.missP?` &nbsp; فترات لم تُسجَّل: <b>${s.missP}</b>`:''}${s.holiday?` &nbsp; إجازات رسمية: <b>${s.holiday}</b>`:''}`;
const printedOn=()=>`طُبع بتاريخ ${ltr(greg(today()))}م`;
function teacherSheet(tc,days){
  const admin=isAdmin();
  const info=days.map(d=>({d,st:dayStatus(tc.id,d)}));
  const hasShift=info.some(x=>x.st.periods.some(p=>p.sh));
  const rows=[];
  info.forEach(({d,st},i)=>{
    const wk=i>0&&dow(d)===0?' wk':'',n=st.periods.length;
    st.periods.forEach((p,j)=>{
      const s=p.st,cls=({none:'st-none',holiday:'st-hol'}[s.k]||'')+(j===0?wk:'');
      let cells='';
      if(j===0)cells+=`<td rowspan="${n}">${DAYS[dow(d)]}</td><td rowspan="${n}">${ltr(hij(d))}</td><td rowspan="${n}">${ltr(greg(d))}</td>`;
      if(hasShift)cells+=`<td>${p.sh?esc(p.sh.name||shiftText(p.sh)):'—'}</td>`;
      cells+=`<td class="tm">${s.in?t12(s.in):''}</td><td class="tm">${s.out?t12(s.out):''}</td><td>${esc(s.label)}</td><td class="nt">${esc(s.note)}</td>`;
      if(admin&&j===0)cells+=`<td class="no-print ed" rowspan="${n}"><button class="linkbtn" data-act="editday" data-tid="${esc(tc.id)}" data-d="${d}" aria-label="تعديل ${d}">تعديل</button></td>`;
      rows.push(`<tr class="${cls}">${cells}</tr>`);
    });
  });
  const shs=personShifts(tc.id);
  return `<section class="paper">${sheetHead()}
    <div class="sh-meta"><div class="who"><b>${tc.kind==='staff'?'الموظف':'المعلم'}:</b> ${esc(tc.name)}${tc.role?`<div class="rl">${esc(tc.role)}</div>`:''}${shs.length?`<div class="rl">${shs.length>1?'الفترات':'الفترة'}: ${esc(shs.map(shiftText).join(' + '))}</div>`:''}</div>${periodBlock(days[0],days[days.length-1])}</div>
    <table class="sh"><thead><tr><th>اليوم</th><th>التاريخ الهجري</th><th>التاريخ الميلادي</th>${hasShift?'<th>الفترة</th>':''}<th>الحضور</th><th>الانصراف</th><th>الحالة</th><th>ملاحظات</th>${admin?'<th class="no-print"></th>':''}</tr></thead><tbody>${rows.join('')}</tbody></table>
    <div class="sh-sum">${sumLine(summarize(tc.id,days))}</div><div class="sh-foot">${printedOn()}</div></section>`;
}
function matrixSheet(list,days){
  const grp=U.rep.ptype==='teacher'?'للمعلمين':U.rep.ptype==='staff'?'للموظفين':'للمعلمين والموظفين';
  const kindLbl=`كشف ${U.rep.kind==='week'?'أسبوعي ':U.rep.kind==='month'?'شهري ':''}شامل ${grp}`;
  const shS=U.rep.shift!=='all'&&U.rep.shift!=='none'&&S.shifts[U.rep.shift];
  const shLine=shS?`<div class="rl">الفترة: ${esc(shiftText(shS))}</div>`:U.rep.shift==='none'?'<div class="rl">بدون فترة محددة</div>':'';
  const head=days.map(d=>`<th class="dh${S.holidays[d]?' hol':''}"><div>${DAYS[dow(d)]}</div><div class="ds">${d.slice(8)}/${d.slice(5,7)}</div></th>`).join('');
  const rows=list.map((tc,i)=>{
    const cells=days.map(d=>{
      const st=dayStatus(tc.id,d);let c='',cl='';
      if(st.k==='present'){
        c=st.periods.map(p=>{const q=p.st;
          if(q.k==='present')return `<div class="c"><span>${t12c(q.in)||'—'}</span><span>${t12c(q.out)||'—'}</span>${q.leave?'<em>استئذان</em>':''}${q.late||q.early?`<em>${[q.late?'تأخر':'',q.early?'مبكر':''].filter(Boolean).join(' + ')}</em>`:''}</div>`;
          return `<div class="c c0"><span>—</span><em>${q.k==='none'?noneLabel():esc(q.label)}</em></div>`}).join('');
      }
      else if(st.k==='absent_ok')c='<div class="c1">غياب</div>';
      else if(st.k==='leave')c='<div class="c1">استئذان</div>';
      else if(st.k==='none'){c='<div class="c1">—</div>';cl='none'}
      else if(st.k==='holiday')cl='hol';
      return `<td class="${cl}${isAdmin()?' editable':''}" ${isAdmin()?`data-act="editday" data-tid="${esc(tc.id)}" data-d="${d}"`:''}>${c}</td>`;
    }).join('');
    const s=summarize(tc.id,days);
    return `<tr><td class="n">${i+1}</td><td class="nm">${esc(tc.name)}</td>${cells}<td class="tot">${s.present}</td><td class="tot">${s.leave}</td><td class="tot">${s.absent}</td><td class="tot">${s.none}</td><td class="tot">${s.late}</td><td class="tot">${s.early}</td></tr>`;
  }).join('');
  return `<section class="paper land">${sheetHead()}
    <div class="sh-meta"><div class="who"><b>${kindLbl}</b><div class="rl">العدد: ${list.length}</div>${shLine}</div>${periodBlock(days[0],days[days.length-1])}</div>
    <table class="sh mx${days.length>10?' dense':''}"><thead><tr><th rowspan="2" class="n">م</th><th rowspan="2" class="nm">اسم المعلم</th>${head}<th colspan="6">الإجمالي</th></tr><tr class="sub">${days.map(()=>'<th class="io">حضور<br>انصراف</th>').join('')}<th>حضور</th><th>استئذان</th><th>غياب بعذر</th><th>${noneLabel()}</th><th>تأخر</th><th>خروج مبكر</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="sh-foot">${printedOn()}</div></section>`;
}

function exportCsv(){
  const [f,t]=repRange(),days=workdays(f,t),tid=isAdmin()?U.rep.tid:Sess.tid;
  const r=U.rep;
  const pf=x=>(r.ptype==='all'||(x.kind||'teacher')===r.ptype)&&(r.shift==='all'||(r.shift==='none'?!(x.shiftIds&&x.shiftIds.length):(x.shiftIds||[]).includes(r.shift)));
  const list=tid==='all'?teachersSorted().filter(x=>x.active!==false&&pf(x)):[{id:tid,...(S.teachers[tid]||{})}];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['الاسم','النوع','الفترة','اليوم','التاريخ الهجري','التاريخ الميلادي','الحضور','الانصراف','الحالة','تأخر (دقائق)','خروج مبكر (دقائق)','ملاحظات']];
  list.forEach(x=>days.forEach(d=>{const st=dayStatus(x.id,d);st.periods.forEach(p=>{const s=p.st;rows.push([x.name,kindLabel(x.kind),p.sh?p.sh.name:'',DAYS[dow(d)],hij(d),greg(d),t12(s.in),t12(s.out),s.label,s.late||'',s.early||'',s.note])})}));
  downloadText(`حضور-وانصراف-${f}_${t}.csv`,'\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'));
}
function stepRep(dir){
  const r=U.rep;
  if(r.kind==='week')r.anchor=addDays(r.anchor,7*dir);
  else{const d=parse(r.anchor);r.anchor=ymd(new Date(d.getFullYear(),d.getMonth()+dir,1))}
  render();
}

  delrange:()=>{
    const t=$('#dr-t').value,f0=$('#dr-f').value,e0=$('#dr-e').value;
    if(!f0||!e0||e0<f0){toast('حدد فترة صحيحة','bad');return}
    const who=t==='all'?'كل الأفراد':(S.teachers[t]?.name||'');
    if(confirm(`سيتم حذف سجلات الحضور والانصراف لـ ${who} من ${f0} إلى ${e0} نهائياً. هل أنت متأكد؟`))act('attDelete',{tid:t,from:f0,to:e0},r=>`تم حذف ${r.removed} سجل`);
  },
  install:()=>doInstall(),
  toggleact:d=>act('teacherActive',{id:d.id,active:S.teachers[d.id]?.active===false}),
  resetpin:d=>{if(confirm('إعادة ضبط رمز هذا المعلم؟ سيُسجَّل خروجه ويضع رمزاً جديداً عند دخوله.'))act('teacherResetPin',{id:d.id},'تمت إعادة الضبط')},
  addhol:()=>{const d=$('#hd-d').value;if(!d){toast('حدد التاريخ','bad');return}act('holAdd',{date:d,name:$('#hd-n').value.trim()},'تمت الإضافة')},
  delhol:d=>act('holDel',{date:d.d}),
  rkind:d=>{if(!U.rep)initRep();U.rep.kind=d.v;render()},
  rprev:()=>stepRep(-1),rnext:()=>stepRep(1),
  rfull:()=>{U.rep.from=firstDataDate();U.rep.to=today();render()},
  print:()=>{try{window.print()}catch(e){toast('تعذّرت الطباعة من هذا المتصفح','bad')}},
  expcsv:()=>exportCsv()
};
document.addEventListener('click',e=>{
  if(e.target.dataset&&e.target.dataset.ov){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const fn=A[b.dataset.act];if(fn)fn(b.dataset,b);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').firstChild)closeModal();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();A[e.target.dataset.enter]&&A[e.target.dataset.enter]()}
});
document.addEventListener('change',e=>{
  const el=e.target,k=el.dataset&&el.dataset.bind;if(!k)return;
  if(k==='lsel'){U.lsel=el.value;render();return}
  if(!U.rep)initRep();
  const r=U.rep;
  if(k==='rtid')r.tid=el.value;
  if(k==='rptype')r.ptype=el.value;
  if(k==='rshift')r.shift=el.value;
  if(k==='ranchor'&&el.value)r.anchor=el.value;
  if(k==='rmonth'&&el.value)r.anchor=el.value+'-01';
  if(k==='rfrom'&&el.value)r.from=el.value;
  if(k==='rto'&&el.value)r.to=el.value;
  render();
});

/* ---------- تثبيت التطبيق (عند التشغيل كتطبيق ويب مثبّت) ---------- */
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;scheduleRender()});
addEventListener('appinstalled',()=>{deferredInstall=null;scheduleRender()});
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installCard(){
  if(!PWA||isStandalone())return '';
  if(deferredInstall)return `<div class="row" style="margin-top:10px"><button class="btn primary sm" data-act="install">${ic('down')}تثبيت التطبيق على جوالك</button></div>`;
  if(isIOS())return `<p class="muted small" style="margin:10px 0 0">لتثبيت التطبيق: اضغط زر المشاركة في Safari ثم «إضافة إلى الشاشة الرئيسية».</p>`;
  return '';
}
async function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;scheduleRender()}

/* ---------- المزامنة الخفيفة ---------- */
async function poll(){
  if(!Sess||document.hidden||U.busy||$('#modal').firstChild)return;
  try{const r=await call('ver');if(r.ver!==S.ver)await loadState()}
  catch(e){if(e.auth)logout('انتهت الجلسة. سجّل الدخول من جديد.')}
  if(curDay!==today()){curDay=today();scheduleRender()}
}
setInterval(poll,45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

/* ---------- البدء ---------- */
(async function init(){
  $('#logoTA').src=LOGO_TA;$('#logoIB').src=LOGO_IB;
  if(Sess){
    try{await loadState();maybeGreet()}
    catch(e){
      if(e.auth){
        Slots[ActiveRole]=null;saveSlot(ActiveRole);
        const other=ActiveRole==='admin'?'teacher':'admin';
        if(Slots[other]){setActive(other);try{await loadState();maybeGreet()}catch(e2){setActive('')}}
        else setActive('');
        toast('انتهت الجلسة. سجّل الدخول من جديد.');
      } else U.err=e.message;
    }
  }
  if(!Sess)await loadList();
  render();
})();
</script>
